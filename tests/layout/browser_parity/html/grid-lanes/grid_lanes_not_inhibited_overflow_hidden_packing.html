<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Grid-lanes not inhibited overflow hidden packing</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/grid-lanes/grid-lanes-not-inhibited-001.html
Original assertion:
<grid class="overflowSet">
Contract:
With overflow hidden creating an independent formatting context, grid-lanes
layout still packs the second and third 30px items into the second 60px column.
-->
<div id="test-root" data-surgeist-layout-ready-inline="true" style="display: block;">
  <div style="vertical-align: top; display: inline grid-lanes; grid-template-columns: 60px 60px; border: 2px solid black;">
    <div style="width: 60px; height: 60px;"></div>
    <div style="width: 60px; height: 30px;"></div>
    <div style="width: 60px; height: 30px;"></div>
  </div>
  <div style="vertical-align: top; display: inline grid-lanes; grid-template-columns: 60px 60px; border: 2px solid black; overflow: hidden;">
    <div style="width: 60px; height: 60px;"></div>
    <div style="width: 60px; height: 30px;"></div>
    <div style="width: 60px; height: 30px;"></div>
  </div>
  <div style="vertical-align: top; display: inline grid-lanes; grid-template-columns: 60px 60px; border: 2px solid black;">
    <div style="width: 60px; height: 60px;"></div>
    <div style="width: 60px; height: 30px;"></div>
    <div style="width: 60px; height: 30px;"></div>
  </div>
  <div style="vertical-align: top; display: inline grid-lanes; grid-template-columns: 60px 60px; border: 2px solid black; overflow: hidden;">
    <div style="width: 60px; height: 60px;"></div>
    <div style="width: 60px; height: 30px;"></div>
    <div style="width: 60px; height: 30px;"></div>
  </div>
</div>

</body>
</html>
