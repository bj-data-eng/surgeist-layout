<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>FRI-07 order flow replaced overflow collapse composition</title>
</head>
<body>

<div id="test-root" style="display: flex; writing-mode: sideways-rl; flex-flow: column-reverse wrap-reverse; width: 120px; height: 180px; gap: 6px; overflow: auto;">
  <div style="order: 2; flex: none; writing-mode: vertical-lr; width: 50px; height: 40px;"></div>
  <img alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2740%27%3E%3C/svg%3E" style="display: block; order: -1; flex: none; width: 40px; height: 80px;">
  <div style="order: 1; flex: none; width: 100px; height: 30px; visibility: collapse; overflow: auto;">
    <div style="width: 140px; height: 60px;"></div>
  </div>
  <div style="order: 0; flex: none; width: 70px; height: 60px; overflow: auto;">
    <div style="width: 120px; height: 100px;"></div>
  </div>
</div>

</body>
</html>
