<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>FRI-08 duplicate line-name token</title>
</head>
<body>

<!-- Duplicate tokens on one physical line count as one occurrence even when an area contributes the same name. -->
<div id="test-root" style="display: grid; grid-template-columns: [zone-start zone-start] 40px [zone-start] 40px; grid-template-rows: 20px; grid-template-areas: &quot;zone zone&quot;; width: 80px; height: 20px; justify-content: start; align-content: start;">
  <div style="grid-column: zone-start 2; grid-row: zone; width: 40px; height: 20px;"></div>
</div>

</body>
</html>
