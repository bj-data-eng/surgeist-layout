<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>FRI-04 grid track math functions</title>
</head>
<body>
<div id="test-root" style="display: grid; width: 240px; grid-template-columns: minmax(calc(25% + 10px), calc(35% + 16px)) fit-content(calc(25% + 15px)); grid-template-rows: 20px; justify-content: start;">
  <div style="width: 90px; height: 20px; min-width: 0;"></div>
  <div style="width: 120px; height: 20px; min-width: 0;"></div>
</div>
</body>
</html>
