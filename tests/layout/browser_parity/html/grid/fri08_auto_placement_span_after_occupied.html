<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>FRI-08 auto placement span after occupied cell</title>
</head>
<body>

<!-- A two-column automatic span advances past the occupied middle cell and creates exactly one implicit row. -->
<div id="test-root" style="display: grid; grid-template-columns: 40px 40px 40px; grid-template-rows: 20px; grid-auto-rows: 20px; width: 120px; justify-content: start; align-content: start;">
  <div style="grid-column: 2; grid-row: 1; width: 40px; height: 20px;"></div>
  <div style="grid-column: span 2; width: 80px; height: 20px;"></div>
</div>

</body>
</html>
