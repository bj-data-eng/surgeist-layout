<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid auto track sizing fixed then auto</title>
  <style>
    html, body { color: black; background-color: white; font: 16px/1 monospace; padding: 0; margin: 0; }
  </style>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/auto-track-sizing-001.html.

A row subgrid in the first column of a 100px/auto parent grid contributes its
content through the auto track sizing algorithm.
-->
<article id="test-root" style="display: grid; max-width: 260px; padding: 1px 5px; border: 1px solid; grid-template-columns: 100px auto;">
  <div style="display: grid; grid-template-rows: subgrid; padding: 3px 5px 7px 11px; border-style: solid; border-width: 5px 7px 11px 3px; margin: 7px 11px 3px 5px; background: grey;">
    The cat can not be separated from milk
  </div>
</article>
</body>
</html>
