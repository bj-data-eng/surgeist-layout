<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid oversized child contribution on standalone axis</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/standalone-axis-size-003.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
The subgrid's explicit 100px standalone-axis size controls the inline-grid
contribution even when its child has a 200px width.
-->
<div id="test-root" style="display: inline-grid; grid-template-rows: 100px;">
  <div style="display: grid; width: 100px; grid-template-rows: subgrid;">
    <div style="width: 200px;"></div>
  </div>
</div>

</body>
</html>
