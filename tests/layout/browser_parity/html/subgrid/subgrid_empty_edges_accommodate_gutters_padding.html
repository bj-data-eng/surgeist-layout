<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid empty edges accommodate gutters and padding</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/subgrid-no-items-on-edges-002.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
Nested empty subgrids spanning parent tracks still contribute edge placeholders
for padding and inherited gutters, filling a 100px by 100px wrapper.
-->
<div id="test-root" style="width: 100px; height: 100px;">
  <div style="display: inline-grid; grid-template-rows: repeat(2, auto); grid-template-columns: repeat(4, auto);">
    <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; grid-column: span 4; grid-row: span 2; gap: 20px 10px; padding: 11px 3px 9px 7px;">
      <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; grid-column: span 2; grid-row: span 2; padding: 11px 3px 9px 7px;">
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
      </div>
      <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; grid-column: span 2; grid-row: span 2; padding: 11px 3px 9px 7px;">
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
        <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; padding: 11px 3px 9px 7px;"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
