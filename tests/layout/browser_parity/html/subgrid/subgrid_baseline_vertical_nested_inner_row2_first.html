<!DOCTYPE html>

<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/subgrid-baseline-006.html
Original assertion:
<div data-offset-x="387" class="item first">
Contract:
In a vertical-rl nested subgrid with margin, border, padding, and gaps, the
first baseline item in the nested subgrid's second row is offset to x=387.
-->

      <div style="height: 40px; box-sizing: border-box; border: 5px solid hotpink; line-height: 0; margin-right: 3px; margin-left: 5px; align-self: baseline;">
        <span style="width: 20px; height: 20px; box-sizing: border-box; border: 5px solid orange; display: inline-block;"></span><br><span style="width: 20px; height: 20px; box-sizing: border-box; border: 5px solid orange; display: inline-block;"></span>
      </div>

      </div>

      </div>
      <div style="height: 40px; box-sizing: border-box; border: 5px solid hotpink; line-height: 0; margin-right: 3px; margin-left: 5px; align-self: last baseline;">

      </div>
    </div>
    <div style="height: 40px; box-sizing: border-box; border: 5px solid hotpink; line-height: 0; margin-right: 3px; margin-left: 5px; align-self: baseline;">

    </div>
