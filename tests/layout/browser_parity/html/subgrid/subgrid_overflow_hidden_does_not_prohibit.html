<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Overflow hidden does not prohibit subgrid</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/overflow-hidden-does-not-prohibit-subgrid.html
Original assertion:
overflow on a grid item does not cause it to establish an independent formatting
context, and as a result does not prohibit subgrid.
Contract:
An overflow-hidden grid item spanning two rows still participates as a row
subgrid, allowing its second-row 50px item to align with the parent grid rows.
-->
<div id="test-root" style="display: inline-grid; grid-template-rows: auto auto; grid-template-columns: auto auto;">
  <div style="width: 50px; height: 50px; grid-row: 1;"></div>
  <div style="display: grid; grid-template-rows: subgrid; overflow: hidden; grid-row: span 2; grid-column: 2;">
    <div style="width: 50px; height: 50px; grid-row: 2;"></div>
  </div>
</div>

</body>
</html>
