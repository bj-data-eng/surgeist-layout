<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid line names 005 LTR parent RTL subgrid x 6 span 4</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/line-names-005.html
Reference:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/line-names-005-ref.html

Original assertion:
A subgrid item resolves a named outer line when the parent grid is LTR and the
subgrid is horizontal RTL.
Contract:
For the third subgrid, grid-column: x 6 / span 4 resolves to the same visual
placement as the WPT reference grid-column: 10 / span 4.
-->
<div id="test-root" style="display: grid; grid-template-rows: [a] repeat(1, [b] auto [c]) [d] repeat(3, [b] auto [c]) [d]; grid-template-columns: [a] 30px [b] 30px [c] 30px [] 30px [e-start] 30px [] 30px [x] 30px [h] 30px [i] 30px [j] 30px [k]; grid-template-areas: '. . . e . . . . . . .'; place-content: start; border: 1px solid; width: 500px; grid-auto-columns: 100px; grid-auto-rows: 100px; font: 12px/1 monospace;">
  <i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i><i style="grid-row: 1;"></i>
  <div style="display: grid; writing-mode: horizontal-tb; direction: rtl; grid-template-rows: auto; grid-template-columns: subgrid; background: lightgrey; grid-column: 2 / span 8; grid-row: 2 / span 2; min-width: 0; min-height: 0;">
    <div style="min-width: 10px; min-height: 20px; background: silver; grid-column: x 6 / span 4;">x</div>
  </div>
</div>

</body>
</html>
