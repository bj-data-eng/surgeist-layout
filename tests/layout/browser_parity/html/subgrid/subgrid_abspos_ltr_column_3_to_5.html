<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid absolute positioning column 3 to 5</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/abs-pos-001.html
Original assertion:
An absolutely positioned item inside a column subgrid is aligned to the
subgridded columns.
Contract:
In the LTR case, an absolute child with grid-column: 3 / 5 uses the inherited
subgrid columns as its containing grid area.
-->
<div id="test-root" style="display: grid; grid-template-rows: repeat(4, auto); grid-template-columns: repeat(10, 30px); place-content: start; border: 1px solid; width: 500px; grid-auto-columns: 100px; grid-auto-rows: 100px; position: relative; padding: 4px 3px 1px 10px; font: 12px/1 monospace;">
  <div style="grid-row: 1;">1</div><div style="grid-row: 1;">2</div><div style="grid-row: 1;">3</div><div style="grid-row: 1;">4</div><div style="grid-row: 1;">5</div><div style="grid-row: 1;">6</div><div style="grid-row: 1;">7</div><div style="grid-row: 1;">8</div><div style="grid-row: 1;">9</div><div style="grid-row: 1;">10</div>
  <div style="display: grid; grid-template-rows: auto; grid-template-columns: subgrid; grid-column: 2 / span 8; grid-row: 2 / span 2; min-width: 0; min-height: 0;">
    <div style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; grid-column: 3 / 5;">x</div>
  </div>
</div>

</body>
</html>
