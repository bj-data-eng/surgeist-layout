<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Vertical subgrid dynamic min-content rows after width change</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/dynamic-min-content-002.html
Original assertion:
After changing the target width from 50px to 100px, test passes if there is a
filled green square and no red.
Contract:
The post-mutation layout recomputes a vertical-rl row subgrid's min-content
contribution to 100px from its horizontal-tb child.
-->
<div id="test-root" style="display: grid; height: 100px; width: min-content;">
  <div style="display: grid; grid-template-rows: subgrid; writing-mode: vertical-rl;">
    <div style="writing-mode: horizontal-tb; width: 100px;"></div>
  </div>
</div>

</body>
</html>
