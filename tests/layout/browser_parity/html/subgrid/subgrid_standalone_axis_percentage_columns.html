<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid standalone axis percentage columns</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/standalone-axis-size-002.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
A row subgrid with min-content inline sizing resolves percentage standalone
columns from the children's 100px min-content contributions.
-->
<div id="test-root" style="display: grid; grid-template-rows: 100px;">
  <div style="display: grid; width: min-content; grid-template-rows: subgrid; grid-template-columns: 20% 30%;">
    <div>
      <div style="width: 100px;"></div>
    </div>
    <div>
      <div style="width: 100px;"></div>
    </div>
  </div>
</div>

</body>
</html>
