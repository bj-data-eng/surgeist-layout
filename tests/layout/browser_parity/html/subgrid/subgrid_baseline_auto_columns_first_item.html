<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid baseline auto columns first item</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/subgrid-baseline-011.html
Original assertion:
<div class="item" data-offset-y="12" data-expected-height="15">X</div>
Contract:
In a subgrid spanning two auto-sized columns, the first 15px item is offset to
y=12 when baseline-aligned with the second 30px item.
-->
<div id="test-root" data-surgeist-layout-ready-inline="true" style="display: inline-grid; align-items: baseline; grid-template-columns: repeat(2, auto); font: 15px/1 ahem;">
  <div style="display: inline-grid; align-items: baseline; grid-column: 1 / -1; grid-template-columns: subgrid;">
    <div data-surgeist-anonymous-grid-text-wrapper="true" style="display: inline-grid; align-items: baseline;">X</div>
    <div data-surgeist-anonymous-grid-text-wrapper="true" style="display: inline-grid; align-items: baseline; font-size: 30px;">X</div>
  </div>
</div>

</body>
</html>
