<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid specified size on standalone axis</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/standalone-axis-size-001.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
A row subgrid with min-content inline sizing uses the 100px item contribution
on its standalone axis while the subgridded row supplies the 100px block size.
-->
<div id="test-root" style="display: grid; grid-template-rows: 100px;">
  <div style="display: grid; width: min-content; grid-template-rows: subgrid;">
    <div style="width: 100px;"></div>
  </div>
</div>

</body>
</html>
