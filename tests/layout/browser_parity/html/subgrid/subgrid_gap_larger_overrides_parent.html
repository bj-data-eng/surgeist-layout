<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid larger gap overrides parent gap</title>
  <style>
    html, body { color: black; background-color: white; font: 16px/1 monospace; padding: 0; margin: 0; }
  </style>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/grid-gap-larger-001.html.

A subgrid with gap: 20px overrides a parent grid with zero gap while spanning
the parent rows and columns.
-->
<div id="test-root" style="display: grid; gap: 0; grid-template-columns: 150px 100px 150px 100px; grid-template-rows: repeat(3, auto); background-color: #fff; color: #444; font: 16px/1 monospace;">
  <div style="background-color: grey; color: #fff; padding: 20px; grid-column: 1 / 3;">A</div>
  <div style="background-color: black; color: #fff; padding: 20px; grid-column: 4;">B</div>
  <div style="background-color: black; color: #fff; padding: 20px; grid-column: 1; grid-row: 2 / 4;">C</div>
  <div style="background-color: #444; color: #fff; padding: 20px; grid-column: 2 / 5; grid-row: 2 / 4; display: grid; gap: 20px; grid-template-rows: subgrid; grid-template-columns: subgrid;">
    <div style="background-color: yellow; color: #444; padding: 20px;">E</div>
    <div style="background-color: purple; color: #444; padding: 20px;">F</div>
    <div style="background-color: #ccc; color: #444; padding: 20px;">G</div>
    <div style="background-color: #ccc; color: #444; padding: 20px;">H</div>
    <div style="background-color: blue; color: #444; padding: 20px;">I</div>
  </div>
</div>
</body>
</html>
