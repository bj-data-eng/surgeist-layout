<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid column gap with empty track</title>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/grid-gap-010.html.

A column subgrid spanning an auto track and a 200px track uses a 100px gap while
placing a 100px item in the second inherited column.
-->
<div id="test-root" style="display: grid; grid-template-columns: auto 200px; width: 200px;">
  <div style="display: grid; grid-template-columns: subgrid; gap: 100px; grid-column: span 2;">
    <div style="width: 100px; height: 100px; background-color: blue; grid-column: 2;"></div>
  </div>
</div>
</body>
</html>
