<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid line names 004 b -2 to b</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/line-names-004.html
Reference:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/line-names-004-ref.html

Original assertion:
A subgrid item can resolve a mix of outer and local subgrid line names.
Contract:
For the eighth item, grid-column: b -2 / b resolves to the same visual
placement as the WPT reference grid-column: 2 / 4.
-->
<div id="test-root" style="display: grid; grid-template-rows: auto; grid-template-columns: [a] 50px 50px 50px 50px [b] 50px 50px [a b]; padding: 20px 10px; font: 24px/1 monospace;">
  <div style="display: grid; grid-template-columns: subgrid [x] [b] [] [] [b]; grid-auto-rows: 10px; grid-column: 2 / span 4;">
    <div style="background: grey; grid-row: 8; grid-column: b -2 / b;"></div>
  </div>
</div>

</body>
</html>
