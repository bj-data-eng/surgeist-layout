<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nested subgrid gap override</title>
  <style>
    html, body { color: black; background-color: white; font: 24px/1 monospace; padding: 0; margin: 0; }
  </style>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/grid-gap-004.html.

A nested subgrid overrides the parent grid gap, and an inner row subgrid keeps
that gap behavior while participating in the outer subgrid's inherited rows.
-->
<div id="test-root" style="display: inline-grid; grid-template-rows: 100px auto; grid-template-columns: 100px auto; gap: 20px; border: 3px solid; background: yellow; font: 24px/1 monospace;">
  <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: subgrid; gap: 100px; grid-area: span 2 / span 2;">
    <div style="display: grid; grid-template-rows: subgrid; grid-template-columns: 100px; gap: 100px; grid-row: span 2;">
      <span style="display: block; width: 24px; height: 24px; background: grey;">a</span>
      <span style="display: block; width: 24px; height: 24px; background: cyan;">b</span>
    </div>
    <span style="display: block; width: 24px; height: 24px; background: grey; grid-area: 2 / 2;">c</span>
  </div>
</div>
</body>
</html>
