<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid standalone axis min-content wrapping</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/standalone-axis-size-005.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
The subgrid's min-content inline size is 100px, causing two 100px inline-block
children to wrap into a 100px by 100px contribution.
-->
<div id="test-root" data-surgeist-layout-ready-inline="true" style="display: grid; width: max-content; grid-template-columns: minmax(min-content, max-content);">
  <div style="display: grid; width: min-content; grid-template-rows: subgrid;">
    <div style="display: block; font-size: 0;">
      <div style="display: inline-block; width: 100px; height: 50px;"></div>
      <div style="display: inline-block; width: 100px; height: 50px;"></div>
    </div>
  </div>
</div>

</body>
</html>
