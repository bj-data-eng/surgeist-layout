<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid relative absolute positioning column 3 to 5</title>
  <style>
    html, body { color: black; background-color: white; font: 12px/1 monospace; padding: 0; margin: 0; }
  </style>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/abs-pos-002.html.

An absolutely positioned item inside a relatively positioned, padded, bordered
column subgrid is aligned to the inherited subgrid column lines.

In the LTR case, an absolute child with grid-column: 3 / 5 uses the inherited
subgrid columns while the containing subgrid establishes the containing block.
-->
<div id="test-root" style="display: grid; grid-template-rows: repeat(4, auto); grid-template-columns: repeat(10, 30px); place-content: start; border: 1px solid; width: 500px; grid-auto-columns: 100px; grid-auto-rows: 100px; padding: 1px 2px; font: 12px/1 monospace;">
  <div style="grid-row: 1;">1</div><div style="grid-row: 1;">2</div><div style="grid-row: 1;">3</div><div style="grid-row: 1;">4</div><div style="grid-row: 1;">5</div><div style="grid-row: 1;">6</div><div style="grid-row: 1;">7</div><div style="grid-row: 1;">8</div><div style="grid-row: 1;">9</div><div style="grid-row: 1;">10</div>
  <div style="position: relative; display: grid; grid-template-rows: auto; grid-template-columns: subgrid; grid-column: 2 / span 8; grid-row: 2 / span 2; padding: 4px 33px 1px 10px; border: 3px solid black; min-width: 0; min-height: 1em; background: yellow;">
    <div style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: silver; grid-column: 3 / 5;">x</div>
  </div>
</div>
</body>
</html>
