<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid definite gap in both axes</title>
  <style>
    html, body { color: black; background-color: white; font: 24px/1 monospace; padding: 0; margin: 0; }
  </style>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/grid-gap-001.html.

A subgrid spanning rows and columns overrides the parent grid's row and column
gaps with definite subgrid gaps while inheriting the spanned track structure.
-->
<div id="test-root" style="display: inline-grid; gap: 20px; grid-template-columns: repeat(4, auto); grid-template-rows: repeat(3, auto); background-color: #fff; color: #444; font: 24px/1 monospace;">
  <div style="background-color: #444; color: #fff; padding: 20px; grid-column: 1 / 3;">A</div>
  <div style="background-color: #444; color: #fff; padding: 20px; grid-column: 4;">B</div>
  <div style="background-color: #444; color: #fff; padding: 20px; grid-column: 1; grid-row: 2 / 4;">C</div>
  <div style="background-color: #444; color: #fff; padding: 20px; grid-column: 2 / 5; grid-row: 2 / 4; display: grid; row-gap: 100px; column-gap: 10px; grid-template-rows: subgrid; grid-template-columns: subgrid;">
    <div style="background-color: #ccc; color: #444; padding: 20px;">E</div>
    <div style="background-color: #ccc; color: #444; padding: 20px;">F</div>
    <div style="background-color: #ccc; color: #444; padding: 20px;">G</div>
    <div style="background-color: #ccc; color: #444; padding: 20px;">H</div>
    <div style="background-color: #ccc; color: #444; padding: 20px;">I</div>
  </div>
</div>
</body>
</html>
