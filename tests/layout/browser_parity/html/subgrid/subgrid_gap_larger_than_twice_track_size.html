<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid column gap larger than twice track size</title>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/grid-gap-012.html.

A column subgrid spanning three 100px parent columns uses a 250px gap, larger
than twice the track size, while preserving the second and third column item
contributions.
-->
<div id="test-root" style="display: grid; grid-template-columns: 100px 100px 100px; width: 300px;">
  <div style="display: grid; grid-template-columns: subgrid; gap: 250px; grid-column: span 3;">
    <div style="width: 100px; height: 100px; background-color: blue; grid-column: 2;"></div>
    <div style="width: 100px; height: 100px; background-color: blue; grid-column: 3;"></div>
  </div>
</div>
</body>
</html>
