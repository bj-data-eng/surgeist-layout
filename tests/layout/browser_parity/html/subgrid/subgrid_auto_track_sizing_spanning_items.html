<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid auto track sizing with spanning items</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/auto-track-sizing-004.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
A subgrid spanning a 10-column by 10-row auto-track parent distributes four
50px by 50px spanning items into a 100px by 100px contribution.
-->
<div id="test-root" style="width: 100px; height: 100px;">
  <div style="display: inline-grid; grid-template-columns: repeat(10, auto); grid-template-rows: repeat(5, 5px auto);">
    <div style="display: grid; grid-template-columns: subgrid; grid-template-rows: subgrid; grid-column-start: 1; grid-column-end: -1; grid-row-start: 1; grid-row-end: -1;">
      <div style="width: 50px; height: 50px; grid-column: span 3; grid-row: span 8;"></div>
      <div style="width: 50px; height: 50px; grid-column: span 7; grid-row: span 8;"></div>
      <div style="width: 50px; height: 50px; grid-column: span 6; grid-row: span 2;"></div>
      <div style="width: 50px; height: 50px; grid-column: span 4; grid-row: span 2;"></div>
    </div>
  </div>
</div>

</body>
</html>
