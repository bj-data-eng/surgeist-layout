<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subgrid auto track sizing all columns span</title>
  <style>
    html, body { color: black; background-color: white; font: 16px/1 monospace; padding: 0; margin: 0; }
  </style>
</head>
<body>
<!--
Derived from WPT css/css-grid/subgrid/auto-track-sizing-001.html.

A row subgrid spanning all three auto/fixed/auto parent columns contributes its
content across the full spanned track range.
-->
<article id="test-root" style="display: grid; max-width: 260px; padding: 1px 5px; border: 1px solid; grid-template-columns: auto 100px auto;">
  <div style="display: grid; grid-template-rows: subgrid; padding: 3px 5px 7px 11px; border-style: solid; border-width: 5px 7px 11px 3px; margin: 7px 11px 3px 5px; background: grey; grid-column: 1 / span 3;">
    The cat can not be separated from milk
  </div>
</article>
</body>
</html>
