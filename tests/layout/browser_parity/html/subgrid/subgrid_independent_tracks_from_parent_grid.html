<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Subgrid independent tracks from parent grid</title>
</head>
<body>

<!--
Derived from WPT:
https://github.com/web-platform-tests/wpt/blob/f01d00b6963a/css/css-grid/subgrid/independent-tracks-from-parent-grid.html
Original assertion:
Test passes if there is a filled green square and no red.
Contract:
A subgrid with standalone rows and subgridded columns is sized by its own four
100px by 25px items, producing a 100px by 100px stack without exposing the
parent grid gap.
-->
<div id="test-root" style="display: inline-grid; gap: 25px;">
  <div style="display: grid; grid-template-columns: subgrid;">
    <div style="width: 100px; height: 25px;"></div>
    <div style="width: 100px; height: 25px;"></div>
    <div style="width: 100px; height: 25px;"></div>
    <div style="width: 100px; height: 25px;"></div>
  </div>
</div>

</body>
</html>
