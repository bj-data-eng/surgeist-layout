[package]
name = "surgeist-layout"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist-layout"
readme = "README.md"
description = "Layout primitives and algorithms for Surgeist document surfaces."

[lib]
name = "surgeist_layout"
path = "src/lib.rs"

[dependencies]
chromiumoxide = { version = "=0.9.1", default-features = false, features = ["fetcher", "rustls", "zip8"], optional = true }
futures = { version = "=0.3.31", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tokio = { version = "=1.48.0", features = ["fs", "macros", "rt-multi-thread"], optional = true }
toml = { version = "=0.9.8", optional = true }
url = { version = "=2.5.7", optional = true }

[features]
default = []
layout-golden-generate = [
    "dep:chromiumoxide",
    "dep:futures",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:toml",
    "dep:url",
]

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
roxmltree = "=0.21.1"
serde_json = "=1.0.145"
surgeist-retained = { path = "../surgeist-retained", version = "=0.1.0" }
surgeist-style = { path = "../surgeist-style", version = "=0.1.0" }

[[bin]]
name = "surgeist-layout-generate"
path = "tests/bin/surgeist-layout-generate.rs"
required-features = ["layout-golden-generate"]
